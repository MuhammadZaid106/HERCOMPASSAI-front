<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background subtle gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#F5F3FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Medical & Guidance Ring -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFC" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="80%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Medical Compass Needle / Cross Linear Gradient (North) -->
    <linearGradient id="northNeedle" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6D28D9" />
      <stop offset="60%" stop-color="#7C5CFC" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <!-- Medical Compass Cross (East/West/South) -->
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFC" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Vitality Heart / Center Core -->
    <linearGradient id="vitalityCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="elevatedShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7C5CFC" flood-opacity="0.22" />
    </filter>
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10B981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGlow)" />

  <!-- Outer Protective Halo (Dual Ring representing Healthcare & Relationship Support) -->
  <circle cx="256" cy="256" r="218" stroke="url(#ringGrad)" stroke-width="12" stroke-linecap="round" opacity="0.95" />
  <circle cx="256" cy="256" r="188" stroke="#E2E8F0" stroke-width="2.5" stroke-dasharray="8 8" opacity="0.8" />

  <!-- Cardinal Compass Markers (N, E, S, W ticks) -->
  <circle cx="256" cy="38" r="6" fill="#7C5CFC" />
  <circle cx="474" cy="256" r="5" fill="#0EA5E9" />
  <circle cx="256" cy="474" r="5" fill="#10B981" />
  <circle cx="38" cy="256" r="5" fill="#6366F1" />

  <!-- Main Medical Cross & Compass Star Structure -->
  <g filter="url(#elevatedShadow)">
    
    <!-- Medical Cross Horizontal Beam (Soft pill shaped medical cross) -->
    <rect x="116" y="226" width="280" height="60" rx="30" fill="url(#crossGrad)" />
    
    <!-- Medical Cross Vertical Base (Soft pill shaped) -->
    <rect x="226" y="116" width="60" height="280" rx="30" fill="url(#crossGrad)" />

    <!-- Guided Compass North Needle (Sharp, focused pointer for direction & guidance) -->
    <path d="M256 68 L286 226 L226 226 Z" fill="url(#northNeedle)" />

    <!-- Guided Compass South Needle -->
    <path d="M256 444 L286 286 L226 286 Z" fill="#4338CA" opacity="0.75" />

    <!-- Guided Compass East Pointer -->
    <path d="M444 256 L286 226 L286 286 Z" fill="#4F46E5" opacity="0.8" />

    <!-- Guided Compass West Pointer -->
    <path d="M68 256 L226 226 L226 286 Z" fill="#6D28D9" opacity="0.8" />

    <!-- Heartbeat / Vitality Pulse Overlay in Cross -->
    <path d="M160 256 L210 256 L225 240 L240 272 L256 236 L272 268 L285 256 L352 256" 
          stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />

    <!-- Radiant Inner Core (Medical Vitality Emerald & White Compass Rose Center) -->
    <circle cx="256" cy="256" r="42" fill="#FFFFFF" />
    <circle cx="256" cy="256" r="32" fill="url(#vitalityCore)" filter="url(#coreGlow)" />
    
    <!-- Center Precision Pearl -->
    <circle cx="256" cy="256" r="12" fill="#FFFFFF" />
  </g>
</svg>
